[project]
name = "trashclassifiication"
version = "0.1.0"
description = "Configuration and preprocessing tools for waste detection datasets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics>=8.4.177",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
